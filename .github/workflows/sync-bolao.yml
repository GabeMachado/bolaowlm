name: Sincronizar Resultados Bolão

on:
  schedule:
    # Roda a cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Permite rodar manualmente pelo GitHub também

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar Edge Function de sincronização
        run: |
          curl -s -X GET \
            "https://gqvjqadugnnhthboxwfb.supabase.co/functions/v1/sync-resultados" \
            -H "Content-Type: application/json" \
            | tee resultado.json
          echo ""
          echo "--- Resultado da sincronização ---"
          cat resultado.json
