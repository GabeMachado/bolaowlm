
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #E78B2E;
    --orange-dark: #c4711a;
    --orange-light: #f5a855;
    --bg: #030710;
    --bg2: #0a1020;
    --bg3: #111827;
    --surface: #1a2235;
    --surface2: #232e42;
    --border: rgba(231,139,46,0.18);
    --border2: rgba(231,139,46,0.35);
    --text: #f0f4ff;
    --text2: #8ea0bc;
    --text3: #5a6b82;
    --green: #22c55e;
    --yellow: #eab308;
    --blue: #3b82f6;
    --red: #ef4444;
    --radius: 10px;
    --radius-lg: 14px;
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; min-height: 100vh; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* NAV */
  nav { background: var(--bg2); border-bottom: 1px solid var(--border2); padding: 0 1rem; display: flex; align-items: center; gap: 0; position: sticky; top: 0; z-index: 100; }
  .nav-brand { font-size: 16px; font-weight: 700; color: var(--orange); padding: 14px 0; margin-right: 1.5rem; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .nav-brand span { font-size: 20px; }
  .nav-tabs { display: flex; gap: 0; flex: 1; overflow-x: auto; }
  .nav-tab { padding: 14px 14px; font-size: 13px; font-weight: 500; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all .15s; background: none; border-top: none; border-left: none; border-right: none; }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active { color: var(--orange); border-bottom-color: var(--orange); }
  .admin-badge { font-size: 10px; background: var(--orange); color: #000; padding: 2px 6px; border-radius: 20px; margin-left: 6px; font-weight: 700; }

  /* LAYOUT */
  .page { padding: 1.5rem 1rem; max-width: 960px; margin: 0 auto; width: 100%; }
  .page-title { font-size: 20px; font-weight: 700; margin-bottom: 1.25rem; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .page-title i { color: var(--orange); font-size: 22px; }

  /* CARDS */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .card-sm { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
  .section-label { font-size: 11px; font-weight: 700; color: var(--orange); letter-spacing: .08em; text-transform: uppercase; margin-bottom: .75rem; }

  /* FORM */
  .form-row { display: flex; gap: .75rem; margin-bottom: .75rem; align-items: flex-end; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px; }
  label { font-size: 12px; color: var(--text2); font-weight: 500; }
  input, select { background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 8px 10px; color: var(--text); font-size: 14px; width: 100%; transition: border-color .15s; outline: none; }
  input:focus, select:focus { border-color: var(--orange); }
  input::placeholder { color: var(--text3); }
  select option { background: var(--bg3); }

  /* BUTTONS */
  .btn { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn-primary { background: var(--orange); color: #000; }
  .btn-primary:hover { background: var(--orange-light); }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--orange); color: var(--orange); }
  .btn-danger { background: rgba(239,68,68,.15); color: var(--red); border: 1px solid rgba(239,68,68,.3); }
  .btn-danger:hover { background: rgba(239,68,68,.25); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* TAGS / BADGES */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge-5 { background: rgba(231,139,46,.2); color: var(--orange); }
  .badge-3 { background: rgba(34,197,94,.15); color: var(--green); }
  .badge-1 { background: rgba(59,130,246,.15); color: var(--blue); }
  .badge-0 { background: var(--surface2); color: var(--text3); }
  .badge-enc { background: rgba(34,197,94,.15); color: var(--green); }
  .badge-pend { background: rgba(234,179,8,.15); color: var(--yellow); }

  /* TABLE */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { padding: 8px 10px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text3); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .06em; }
  .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr:hover td { background: var(--surface2); }
  .tbl .rank { font-weight: 700; font-size: 15px; color: var(--orange); }
  .tbl .pts { font-weight: 700; font-size: 15px; }
  .nome-cell { font-weight: 600; }
  .sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* JOGO CARD */
  .jogo-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: .5rem; padding: .75rem 1rem; }
  .jogo-card.encerrado { border-color: rgba(34,197,94,.2); }
  .jogo-header { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
  .jogo-num { font-size: 11px; font-weight: 700; color: var(--text3); }
  .jogo-fase { font-size: 10px; color: var(--orange); font-weight: 700; background: rgba(231,139,46,.1); padding: 2px 6px; border-radius: 20px; text-transform: uppercase; }
  .jogo-grupo { font-size: 10px; color: var(--text3); }
  .jogo-placar { display: flex; align-items: center; gap: .75rem; }
  .jogo-time { flex: 1; text-align: right; font-weight: 600; font-size: 13px; }
  .jogo-time.fora { text-align: left; }
  .placar-box { display: flex; align-items: center; gap: 6px; }
  .placar-num { font-size: 20px; font-weight: 800; color: var(--orange); width: 28px; text-align: center; }
  .placar-sep { font-size: 16px; color: var(--text3); }
  .placar-input { width: 40px !important; text-align: center; font-size: 16px; font-weight: 700; padding: 4px !important; }

  /* RANKING PODIO */
  .podio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  .podio-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; text-align: center; position: relative; }
  .podio-card.p1 { border-color: var(--orange); background: rgba(231,139,46,.07); }
  .podio-card.p2 { border-color: rgba(192,192,192,.3); }
  .podio-card.p3 { border-color: rgba(180,120,60,.3); }
  .podio-pos { font-size: 28px; margin-bottom: 6px; }
  .podio-nome { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .podio-pts { font-size: 22px; font-weight: 800; color: var(--orange); }
  .podio-sub { font-size: 11px; color: var(--text3); }

  /* TABS FASES */
  .fase-tabs { display: flex; gap: .5rem; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 2px; }
  .fase-tab { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); color: var(--text2); background: var(--surface); white-space: nowrap; transition: all .15s; }
  .fase-tab.active { background: var(--orange); border-color: var(--orange); color: #000; }
  .fase-tab:hover:not(.active) { border-color: var(--orange); color: var(--orange); }

  /* PALPITE GRID */
  .palpite-grid { display: grid; grid-template-columns: 1fr; gap: .5rem; }
  .palpite-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg3); border-radius: var(--radius); padding: .6rem .8rem; gap: .5rem; }
  .pi-participante { font-size: 12px; font-weight: 600; min-width: 80px; }
  .pi-placar { font-size: 14px; font-weight: 700; color: var(--orange); }
  .pi-pts { font-size: 12px; font-weight: 700; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(3,7,16,.85); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 1.5rem; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }
  .modal-title i { color: var(--orange); }
  .modal-footer { display: flex; gap: .75rem; margin-top: 1.25rem; justify-content: flex-end; }

  /* ALERT */
  .alert { padding: .75rem 1rem; border-radius: var(--radius); font-size: 13px; margin-bottom: 1rem; }
  .alert-success { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.25); color: var(--green); }
  .alert-error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); color: var(--red); }

  /* ADMIN LOGIN */
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
  .login-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 360px; text-align: center; }
  .login-logo { font-size: 40px; margin-bottom: 1rem; }
  .login-title { font-size: 20px; font-weight: 700; margin-bottom: .5rem; }
  .login-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; }

  /* STATS ROW */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1.25rem; }
  .stat-card { background: var(--surface2); border-radius: var(--radius); padding: .875rem; text-align: center; border: 1px solid var(--border); }
  .stat-num { font-size: 22px; font-weight: 800; color: var(--orange); }
  .stat-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

  /* CAMPEAO */
  .campeao-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--orange); background: rgba(231,139,46,.12); padding: 3px 8px; border-radius: 20px; }

  /* PRINT */
  @media print {
    nav, .btn, .fase-tabs, .form-row { display: none !important; }
    body { background: white; color: #000; }
    .card, .tbl th { background: #f5f5f5 !important; }
  }

  .divider { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
  .empty { text-align: center; padding: 2rem; color: var(--text3); font-size: 13px; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .tag-grupo { font-size: 11px; font-weight: 700; background: var(--surface2); color: var(--text2); padding: 2px 6px; border-radius: 4px; }
  .flex { display: flex; }
  .gap-1 { gap: .5rem; }
  .gap-2 { gap: 1rem; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .mt-1 { margin-top: .5rem; }
  .mt-2 { margin-top: 1rem; }
  .text-orange { color: var(--orange); }
  .text-muted { color: var(--text2); }
  .fw-700 { font-weight: 700; }
  .scroll-x { overflow-x: auto; }
</style>

<div id="app">
  <nav>
    <div class="nav-brand"><span>⚽</span> Bolão Copa 2026</div>
    <div class="nav-tabs" id="nav-tabs"></div>
  </nav>
  <div id="main-content"></div>
</div>

<script>
const SUPABASE_URL = 'https://gqvjqadugnnhthboxwfb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxdmpxYWR1Z25uaHRoYm94d2ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTc2NDgsImV4cCI6MjA5Njc3MzY0OH0.tEuXQtl0Lwo9HQ22EvxnkGEOb93zdvvF8TDuX6f_BsM';
const ADMIN_PASSWORD = 'copa2026';

const GRUPOS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
const FASES = {grupo:'Grupos', oitavas:'Oitavas', quartas:'Quartas', semi:'Semifinais', final_4:'Semifinal Final', terceiro:'3º Lugar', final:'Final'};
const CAMPEOES_OPCOES = ['México','Coreia do Sul','República Tcheca','África do Sul','Canadá','Bósnia','Qatar','Suíça','Brasil','Haiti','Escócia','Marrocos','EUA','Austrália','Turquia','Paraguai','Alemanha','Costa do Marfim','Equador','Curaçao','Holanda','Suécia','Tunísia','Japão','Bélgica','Irã','Nova Zelândia','Egito','Espanha','Arábia Saudita','Uruguai','Cabo Verde','França','Iraque','Noruega','Senegal','Argentina','Áustria','Jordânia','Argélia','Portugal','Uzbequistão','Colômbia','RD Congo','Inglaterra','Gana','Panamá','Croácia'].sort();

let state = { tab: 'ranking', adminLogado: false, jogos: [], participantes: [], palpites: [], ranking: [], loading: false, msg: null, fase: 'grupo', grupo: 'A', jogoSel: null, partSel: null };

async function api(path, method='GET', body=null) {
  const opts = { method, headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer '+SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': method === 'POST' ? 'return=representation' : '' }};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(SUPABASE_URL+path, opts);
  if (!r.ok && r.status !== 204) { const e = await r.json(); throw new Error(e.message||'Erro'); }
  if (r.status === 204) return null;
  return r.json();
}

async function loadAll() {
  state.loading = true; render();
  try {
    const [j, p, pa] = await Promise.all([
      api('/rest/v1/jogos?select=*&order=numero'),
      api('/rest/v1/participantes?select=*&order=nome'),
      api('/rest/v1/palpites?select=*')
    ]);
    state.jogos = j || [];
    state.participantes = p || [];
    state.palpites = pa || [];
    computeRanking();
  } catch(e) { showMsg('Erro ao carregar dados: '+e.message, true); }
  state.loading = false; render();
}

function computeRanking() {
  const map = {};
  for (const p of state.participantes) {
    map[p.id] = { id: p.id, nome: p.nome, campeao: p.palpite_campeao||'—', pts: 0, exatos: 0, resultados: 0, parciais: 0, zero: 0 };
  }
  for (const pa of state.palpites) {
    if (!map[pa.participante_id]) continue;
    const m = map[pa.participante_id];
    if (pa.pontos === 5) { m.pts += 5; m.exatos++; }
    else if (pa.pontos === 3) { m.pts += 3; m.resultados++; }
    else if (pa.pontos === 1) { m.pts += 1; m.parciais++; }
    else if (pa.pontos === 0 && pa.pontos !== null) { m.zero++; }
  }
  state.ranking = Object.values(map).sort((a,b) => b.pts-a.pts || b.exatos-a.exatos || b.resultados-a.resultados || b.parciais-a.parciais);
}

function showMsg(txt, err=false) {
  state.msg = { txt, err }; render();
  setTimeout(() => { state.msg = null; render(); }, 3000);
}

function setTab(t) { state.tab = t; render(); }

// ---- RENDER PRINCIPAL ----
function render() {
  const tabs = [
    { id: 'ranking', label: 'Ranking', icon: 'ti-trophy' },
    { id: 'jogos', label: 'Jogos', icon: 'ti-ball-football' },
    { id: 'palpites-pub', label: 'Palpites', icon: 'ti-target' },
    { id: 'admin', label: 'Admin', icon: 'ti-settings', badge: true },
  ];
  document.getElementById('nav-tabs').innerHTML = tabs.map(t => `
    <button class="nav-tab ${state.tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      <i class="ti ${t.icon}" aria-hidden="true"></i> ${t.label}
      ${t.badge?'<span class="admin-badge">ADM</span>':''}
    </button>`).join('');

  const el = document.getElementById('main-content');
  if (state.loading) { el.innerHTML = '<div class="page"><div class="empty"><i class="ti ti-loader spin" style="font-size:24px"></i><br>Carregando...</div></div>'; return; }
  if (state.tab === 'ranking') el.innerHTML = renderRanking();
  else if (state.tab === 'jogos') el.innerHTML = renderJogos();
  else if (state.tab === 'palpites-pub') el.innerHTML = renderPalpitesPub();
  else if (state.tab === 'admin') el.innerHTML = state.adminLogado ? renderAdmin() : renderLogin();
}

// ---- RANKING ----
function renderRanking() {
  const r = state.ranking;
  const totalJogos = state.jogos.filter(j=>j.encerrado).length;
  const totalPalpites = state.palpites.length;
  const totalExatos = state.palpites.filter(p=>p.pontos===5).length;

  let podio = '';
  if (r.length >= 1) {
    const p1 = r[0], p2 = r[1]||null, p3 = r[2]||null;
    podio = `<div class="podio">
      ${p2 ? `<div class="podio-card p2"><div class="podio-pos">🥈</div><div class="podio-nome">${p2.nome}</div><div class="podio-pts">${p2.pts} pts</div><div class="podio-sub">${p2.exatos}⭐ ${p2.resultados}✓ ${p2.parciais}〜</div></div>` : '<div></div>'}
      <div class="podio-card p1"><div class="podio-pos">🏆</div><div class="podio-nome">${p1.nome}</div><div class="podio-pts">${p1.pts} pts</div><div class="podio-sub">${p1.exatos}⭐ ${p1.resultados}✓ ${p1.parciais}〜</div></div>
      ${p3 ? `<div class="podio-card p3"><div class="podio-pos">🥉</div><div class="podio-nome">${p3.nome}</div><div class="podio-pts">${p3.pts} pts</div><div class="podio-sub">${p3.exatos}⭐ ${p3.resultados}✓ ${p3.parciais}〜</div></div>` : '<div></div>'}
    </div>`;
  }

  const rows = r.map((p,i) => {
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    return `<tr>
      <td class="rank">${medal||i+1}</td>
      <td class="nome-cell">${p.nome}<div class="sub campeao-badge" style="display:inline-flex;margin-top:4px">⭐ ${p.campeao}</div></td>
      <td class="pts text-orange">${p.pts}</td>
      <td><span class="badge badge-5">⭐ ${p.exatos}</span></td>
      <td><span class="badge badge-3">✓ ${p.resultados}</span></td>
      <td><span class="badge badge-1">〜 ${p.parciais}</span></td>
    </tr>`;
  }).join('');

  return `<div class="page">
    <h2 class="sr-only">Ranking do Bolão Copa 2026</h2>
    <div class="page-title"><i class="ti ti-trophy"></i> Ranking</div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${r.length}</div><div class="stat-lbl">Participantes</div></div>
      <div class="stat-card"><div class="stat-num">${totalJogos}</div><div class="stat-lbl">Jogos encerrados</div></div>
      <div class="stat-card"><div class="stat-num">${totalPalpites}</div><div class="stat-lbl">Palpites</div></div>
      <div class="stat-card"><div class="stat-num">${totalExatos}</div><div class="stat-lbl">Placares exatos</div></div>
    </div>
    ${podio}
    ${state.msg ? `<div class="alert ${state.msg.err?'alert-error':'alert-success'}">${state.msg.txt}</div>` : ''}
    <div class="card" style="padding:0; overflow:hidden;">
      <div style="padding:.75rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
        <span class="section-label" style="margin:0">Classificação completa</span>
        <button class="btn btn-ghost btn-sm" onclick="window.print()"><i class="ti ti-printer"></i> Imprimir</button>
      </div>
      <div class="scroll-x">
        <table class="tbl">
          <thead><tr><th>#</th><th>Participante</th><th>Pontos</th><th>Exatos</th><th>Resultado</th><th>Parcial</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty">Nenhum participante cadastrado</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:.75rem;">⭐ Placar exato = 5pts &nbsp;|&nbsp; ✓ Resultado certo = 3pts &nbsp;|&nbsp; 〜 Acerto parcial = 1pt</div>
  </div>`;
}

// ---- JOGOS ----
function renderJogos() {
  const fasesDisponiveis = [...new Set(state.jogos.map(j=>j.fase))];
  const jogosFiltrados = state.fase === 'grupo'
    ? state.jogos.filter(j => j.fase==='grupo' && j.grupo_id === (GRUPOS.indexOf(state.grupo)+1))
    : state.jogos.filter(j => j.fase === state.fase);

  const faseTabs = Object.entries(FASES).map(([k,v]) =>
    `<button class="fase-tab ${state.fase===k?'active':''}" onclick="state.fase='${k}';render()">${v}</button>`
  ).join('');

  const grupoTabs = state.fase === 'grupo' ? `
    <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;">
      ${GRUPOS.map(g => `<button class="fase-tab ${state.grupo===g?'active':''}" onclick="state.grupo='${g}';render()">Grupo ${g}</button>`).join('')}
    </div>` : '';

  const jogoCards = jogosFiltrados.map(j => {
    const status = j.encerrado
      ? `<span class="badge badge-enc">✓ Encerrado</span>`
      : `<span class="badge badge-pend">Pendente</span>`;
    const placar = j.encerrado
      ? `<span class="placar-num">${j.gols_casa}</span><span class="placar-sep">×</span><span class="placar-num">${j.gols_fora}</span>`
      : `<span class="placar-sep" style="color:var(--text3);font-size:13px;">vs</span>`;
    return `<div class="jogo-card ${j.encerrado?'encerrado':''}">
      <div class="jogo-header">
        <span class="jogo-num">Jogo ${j.numero}</span>
        <span class="jogo-fase">${FASES[j.fase]||j.fase}</span>
        ${j.grupo_id ? `<span class="jogo-grupo">Grupo ${GRUPOS[j.grupo_id-1]}</span>` : ''}
        <span style="flex:1"></span>
        ${status}
      </div>
      <div class="jogo-placar">
        <div class="jogo-time">${j.time_casa}</div>
        <div class="placar-box">${placar}</div>
        <div class="jogo-time fora">${j.time_fora}</div>
      </div>
    </div>`;
  }).join('') || '<div class="empty">Nenhum jogo encontrado</div>';

  return `<div class="page">
    <div class="page-title"><i class="ti ti-ball-football"></i> Tabela de Jogos</div>
    <div class="fase-tabs">${faseTabs}</div>
    ${grupoTabs}
    ${jogoCards}
  </div>`;
}

// ---- PALPITES PÚBLICO ----
function renderPalpitesPub() {
  const jogosFiltrados = state.fase === 'grupo'
    ? state.jogos.filter(j => j.fase==='grupo' && j.grupo_id === (GRUPOS.indexOf(state.grupo)+1))
    : state.jogos.filter(j => j.fase === state.fase);

  const faseTabs = Object.entries(FASES).map(([k,v]) =>
    `<button class="fase-tab ${state.fase===k?'active':''}" onclick="state.fase='${k}';render()">${v}</button>`
  ).join('');
  const grupoTabs = state.fase === 'grupo' ? `
    <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;">
      ${GRUPOS.map(g => `<button class="fase-tab ${state.grupo===g?'active':''}" onclick="state.grupo='${g}';render()">Grupo ${g}</button>`).join('')}
    </div>` : '';

  const jogosHtml = jogosFiltrados.map(j => {
    const palp = state.palpites.filter(p => p.jogo_id === j.id);
    const partMap = {};
    for (const pp of state.participantes) partMap[pp.id] = pp.nome;

    const palpHtml = palp.length === 0
      ? '<div class="empty" style="padding:.5rem">Nenhum palpite</div>'
      : palp.map(p => {
          const pts = p.pontos;
          const badge = pts===5?'badge-5 ⭐5':pts===3?'badge-3 ✓3':pts===1?'badge-1 〜1':'badge-0 —';
          const [bc,cl] = badge.split(' ');
          return `<div class="palpite-item">
            <span class="pi-participante">${partMap[p.participante_id]||'?'}</span>
            <span class="pi-placar">${p.gols_casa} × ${p.gols_fora}</span>
            ${j.encerrado ? `<span class="badge ${bc} pi-pts">${cl}</span>` : ''}
          </div>`;
        }).join('');

    return `<div class="jogo-card ${j.encerrado?'encerrado':''}">
      <div class="jogo-header">
        <span class="jogo-num">Jogo ${j.numero}</span>
        <span class="jogo-fase">${FASES[j.fase]||j.fase}</span>
        <span style="flex:1"></span>
        ${j.encerrado ? `<span class="badge badge-enc">✓ ${j.gols_casa}×${j.gols_fora}</span>` : '<span class="badge badge-pend">Pendente</span>'}
      </div>
      <div class="jogo-placar" style="margin-bottom:.75rem">
        <div class="jogo-time">${j.time_casa}</div>
        <div class="placar-box"><span class="placar-sep">vs</span></div>
        <div class="jogo-time fora">${j.time_fora}</div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:.4rem;font-weight:700">${palp.length} palpites</div>
      <div class="palpite-grid">${palpHtml}</div>
    </div>`;
  }).join('') || '<div class="empty">Nenhum jogo</div>';

  return `<div class="page">
    <div class="page-title"><i class="ti ti-target"></i> Palpites</div>
    <div class="fase-tabs">${faseTabs}</div>
    ${grupoTabs}
    ${jogosHtml}
  </div>`;
}

// ---- LOGIN ADMIN ----
function renderLogin() {
  return `<div class="page login-wrap">
    <div class="login-card">
      <div class="login-logo">⚽</div>
      <div class="login-title">Área Administrativa</div>
      <div class="login-sub">Digite a senha para acessar</div>
      ${state.msg ? `<div class="alert ${state.msg.err?'alert-error':'alert-success'}">${state.msg.txt}</div>` : ''}
      <div class="form-group" style="margin-bottom:.75rem">
        <input type="password" id="admin-pass" placeholder="Senha" onkeydown="if(event.key==='Enter')loginAdmin()" />
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="loginAdmin()"><i class="ti ti-lock"></i> Entrar</button>
    </div>
  </div>`;
}

function loginAdmin() {
  const v = document.getElementById('admin-pass')?.value;
  if (v === ADMIN_PASSWORD) { state.adminLogado = true; render(); }
  else showMsg('Senha incorreta', true);
}

// ---- ADMIN ----
function renderAdmin() {
  const encerrados = state.jogos.filter(j=>j.encerrado).length;
  const pendentes = state.jogos.filter(j=>!j.encerrado).length;
  return `<div class="page">
    <div class="page-title"><i class="ti ti-settings"></i> Administração
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="state.adminLogado=false;render()"><i class="ti ti-logout"></i></button>
    </div>
    ${state.msg ? `<div class="alert ${state.msg.err?'alert-error':'alert-success'}">${state.msg.txt}</div>` : ''}
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${state.participantes.length}</div><div class="stat-lbl">Participantes</div></div>
      <div class="stat-card"><div class="stat-num">${state.palpites.length}</div><div class="stat-lbl">Palpites</div></div>
      <div class="stat-card"><div class="stat-num">${encerrados}</div><div class="stat-lbl">Encerrados</div></div>
      <div class="stat-card"><div class="stat-num">${pendentes}</div><div class="stat-lbl">Pendentes</div></div>
    </div>

    <div class="card">
      <div class="section-label">Cadastrar participante</div>
      <div class="form-row">
        <div class="form-group"><label>Nome</label><input id="np-nome" placeholder="Nome do participante"/></div>
        <div class="form-group"><label>Palpite campeão</label>
          <select id="np-campeao"><option value="">Escolher...</option>${CAMPEOES_OPCOES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </div>
        <button class="btn btn-primary" onclick="cadastrarPart()"><i class="ti ti-user-plus"></i> Cadastrar</button>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:.75rem 1.25rem;border-bottom:1px solid var(--border)"><span class="section-label" style="margin:0">Participantes</span></div>
      <div class="scroll-x">
        <table class="tbl">
          <thead><tr><th>Nome</th><th>Campeão</th><th>Palpites</th><th></th></tr></thead>
          <tbody>${state.participantes.map(p => {
            const np = state.palpites.filter(x=>x.participante_id===p.id).length;
            return `<tr>
              <td class="nome-cell">${p.nome}</td>
              <td><span class="campeao-badge">⭐ ${p.palpite_campeao||'—'}</span></td>
              <td>${np}</td>
              <td><button class="btn btn-ghost btn-sm" onclick="openPalpitesModal('${p.id}')"><i class="ti ti-edit"></i> Palpites</button></td>
            </tr>`;
          }).join('') || '<tr><td colspan="4" class="empty">Nenhum participante</td></tr>'}</tbody>
        </table>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:.75rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
        <span class="section-label" style="margin:0">Registrar resultados</span>
      </div>
      <div style="padding:1rem">
        <div class="fase-tabs">${Object.entries(FASES).map(([k,v])=>`<button class="fase-tab ${state.fase===k?'active':''}" onclick="state.fase='${k}';render()">${v}</button>`).join('')}</div>
        ${state.fase==='grupo'?`<div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;">${GRUPOS.map(g=>`<button class="fase-tab ${state.grupo===g?'active':''}" onclick="state.grupo='${g}';render()">Grupo ${g}</button>`).join('')}</div>`:''}
        ${renderJogosAdmin()}
      </div>
    </div>
  </div>`;
}

function renderJogosAdmin() {
  const filtrados = state.fase === 'grupo'
    ? state.jogos.filter(j => j.fase==='grupo' && j.grupo_id === (GRUPOS.indexOf(state.grupo)+1))
    : state.jogos.filter(j => j.fase === state.fase);
  return filtrados.map(j => {
    return `<div class="jogo-card ${j.encerrado?'encerrado':''}">
      <div class="jogo-header">
        <span class="jogo-num">Jogo ${j.numero}</span>
        ${j.grupo_id?`<span class="jogo-grupo">Grupo ${GRUPOS[j.grupo_id-1]}</span>`:''}
        <span style="flex:1"></span>
        ${j.encerrado?'<span class="badge badge-enc">✓ Encerrado</span>':'<span class="badge badge-pend">Pendente</span>'}
      </div>
      <div class="jogo-placar">
        <div class="jogo-time">${j.time_casa}</div>
        <div class="placar-box">
          <input class="placar-input" type="number" min="0" max="99" id="gc-${j.id}" value="${j.gols_casa??''}" placeholder="—" ${j.encerrado?'disabled':''}>
          <span class="placar-sep">×</span>
          <input class="placar-input" type="number" min="0" max="99" id="gf-${j.id}" value="${j.gols_fora??''}" placeholder="—" ${j.encerrado?'disabled':''}>
        </div>
        <div class="jogo-time fora">${j.time_fora}</div>
      </div>
      ${!j.encerrado?`<div style="text-align:center;margin-top:.6rem">
        <button class="btn btn-primary btn-sm" onclick="salvarResultado(${j.id})"><i class="ti ti-check"></i> Salvar & Encerrar</button>
      </div>`:`<div style="text-align:center;margin-top:.4rem"><button class="btn btn-danger btn-sm" onclick="reabrirJogo(${j.id})"><i class="ti ti-refresh"></i> Reabrir jogo</button></div>`}
    </div>`;
  }).join('') || '<div class="empty">Nenhum jogo nesta fase</div>';
}

// ---- MODAL PALPITES ----
function openPalpitesModal(partId) {
  state.partSel = partId;
  const part = state.participantes.find(p=>p.id===partId);
  const jogosFase = state.jogos.filter(j=>j.fase==='grupo');
  const palp = state.palpites.filter(p=>p.participante_id===partId);
  const palpMap = {};
  for (const p of palp) palpMap[p.jogo_id] = p;

  const jogosOpts = state.jogos.filter(j=>!j.encerrado).map(j =>
    `<option value="${j.id}">[${j.numero}] ${j.time_casa} × ${j.time_fora}</option>`
  ).join('');

  const el = document.createElement('div');
  el.className = 'modal-overlay';
  el.id = 'modal-palpites';
  el.innerHTML = `
    <div class="modal">
      <div class="modal-title"><i class="ti ti-target"></i> Palpites de ${part?.nome}</div>
      <div class="section-label">Adicionar palpite</div>
      <div class="form-row">
        <div class="form-group" style="flex:2"><label>Jogo</label>
          <select id="mp-jogo">${jogosOpts||'<option>Sem jogos disponíveis</option>'}</select>
        </div>
        <div class="form-group"><label>Casa</label><input type="number" id="mp-gc" placeholder="0" min="0" max="99" style="width:60px"/></div>
        <div class="form-group"><label>Fora</label><input type="number" id="mp-gf" placeholder="0" min="0" max="99" style="width:60px"/></div>
        <button class="btn btn-primary btn-sm" onclick="salvarPalpite('${partId}')"><i class="ti ti-plus"></i></button>
      </div>
      <hr class="divider"/>
      <div class="section-label">Palpites cadastrados</div>
      <div id="palpite-lista">
        ${palp.length===0?'<div class="empty">Nenhum palpite ainda</div>':palp.map(p=>{
          const j = state.jogos.find(x=>x.id===p.jogo_id);
          return `<div class="palpite-item">
            <span style="font-size:11px;color:var(--text3)">Jogo ${j?.numero||'?'}</span>
            <span style="font-size:12px;flex:1;margin:0 .5rem">${j?.time_casa||'?'} × ${j?.time_fora||'?'}</span>
            <span class="pi-placar">${p.gols_casa} × ${p.gols_fora}</span>
            <button class="btn btn-danger btn-sm" onclick="excluirPalpite('${p.id}','${partId}')"><i class="ti ti-trash"></i></button>
          </div>`;
        }).join('')}
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="fecharModal()">Fechar</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}

function fecharModal() {
  document.getElementById('modal-palpites')?.remove();
}

async function salvarPalpite(partId) {
  const jogoId = parseInt(document.getElementById('mp-jogo')?.value);
  const gc = parseInt(document.getElementById('mp-gc')?.value);
  const gf = parseInt(document.getElementById('mp-gf')?.value);
  if (!jogoId || isNaN(gc) || isNaN(gf)) { showMsg('Preencha todos os campos', true); return; }
  const jogo = state.jogos.find(j=>j.id===jogoId);
  if (jogo?.encerrado) { showMsg('Este jogo já foi encerrado', true); return; }
  const existe = state.palpites.find(p=>p.participante_id===partId && p.jogo_id===jogoId);
  try {
    if (existe) {
      await api(`/rest/v1/palpites?id=eq.${existe.id}`, 'PATCH', { gols_casa: gc, gols_fora: gf });
    } else {
      await api('/rest/v1/palpites', 'POST', { participante_id: partId, jogo_id: jogoId, gols_casa: gc, gols_fora: gf });
    }
    fecharModal();
    await loadAll();
    showMsg('Palpite salvo!');
    openPalpitesModal(partId);
  } catch(e) { showMsg('Erro: '+e.message, true); }
}

async function excluirPalpite(id, partId) {
  if (!confirm('Remover este palpite?')) return;
  try {
    await api(`/rest/v1/palpites?id=eq.${id}`, 'DELETE');
    fecharModal();
    await loadAll();
    showMsg('Palpite removido');
    openPalpitesModal(partId);
  } catch(e) { showMsg('Erro: '+e.message, true); }
}

async function cadastrarPart() {
  const nome = document.getElementById('np-nome')?.value?.trim();
  const campeao = document.getElementById('np-campeao')?.value;
  if (!nome) { showMsg('Informe o nome', true); return; }
  try {
    await api('/rest/v1/participantes', 'POST', { nome, palpite_campeao: campeao||null });
    await loadAll();
    showMsg('Participante cadastrado!');
    document.getElementById('np-nome').value = '';
    document.getElementById('np-campeao').value = '';
  } catch(e) { showMsg('Erro: '+e.message, true); }
}

async function salvarResultado(jogoId) {
  const gc = parseInt(document.getElementById('gc-'+jogoId)?.value);
  const gf = parseInt(document.getElementById('gf-'+jogoId)?.value);
  if (isNaN(gc) || isNaN(gf)) { showMsg('Informe o placar completo', true); return; }
  if (!confirm('Encerrar este jogo? Os palpites serão pontuados.')) return;
  try {
    await api(`/rest/v1/jogos?id=eq.${jogoId}`, 'PATCH', { gols_casa: gc, gols_fora: gf, encerrado: true });
    await loadAll();
    showMsg('Resultado salvo e pontos computados!');
  } catch(e) { showMsg('Erro: '+e.message, true); }
}

async function reabrirJogo(jogoId) {
  if (!confirm('Reabrir este jogo? Os pontos serão zerados para os palpites relacionados.')) return;
  try {
    await api(`/rest/v1/jogos?id=eq.${jogoId}`, 'PATCH', { gols_casa: null, gols_fora: null, encerrado: false });
    await api(`/rest/v1/palpites?jogo_id=eq.${jogoId}`, 'PATCH', { pontos: null });
    await loadAll();
    showMsg('Jogo reaberto!');
  } catch(e) { showMsg('Erro: '+e.message, true); }
}

loadAll();
</script>
